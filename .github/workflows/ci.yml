name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: readly
          POSTGRES_PASSWORD: readly
          POSTGRES_DB: readly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U readly -d readly_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://readly:readly@localhost:5432/readly_test
      TEST_DATABASE_URL: postgresql://readly:readly@localhost:5432/readly_test
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
