name: readly

x-app-env: &app-env
  DATABASE_URL: postgresql://readly:readly@postgres:5432/readly
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@readly.local}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_DEMO: ${SEED_DEMO:-true}
  WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
  WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
  WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:admin@readly.local}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: readly
      POSTGRES_PASSWORD: readly
      POSTGRES_DB: readly
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readly -d readly"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies migrations and seeds the admin account, then exits.
  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  app:
    build: .
    command: npm run start
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

  worker:
    build: .
    command: npm run worker
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

volumes:
  pgdata:
